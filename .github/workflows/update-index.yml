name: Aggiorna canti/index.json

on:
  push:
    branches:
      - main
    paths:
      - 'canti/*.json'
      - '!canti/index.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Genera canti/index.json automaticamente
        run: |
          python3 -c "
          import os, json

          items = []
          for f in sorted(os.listdir('canti')):
              if f.endswith('.json') and f != 'index.json':
                  path = os.path.join('canti', f)
                  try:
                      with open(path, encoding='utf-8') as fp:
                          d = json.load(fp)
                      slug = d.get('id') or d.get('slug') or f[:-5]
                      cats = d.get('categories') or ([d['category']] if d.get('category') else ['Canti vari'])
                      items.append({
                          'slug': slug,
                          'title': d.get('title', slug),
                          'author': d.get('sub') or d.get('author', ''),
                          'categories': cats,
                          'search': d.get('search', ''),
                          'file': f
                      })
                  except Exception as e:
                      print(f'Errore su {f}: {e}')

          with open('canti/index.json', 'w', encoding='utf-8') as out:
              json.dump(items, out, ensure_ascii=False, indent=2)
          print(f'Aggiornato index.json con {len(items)} canti.')
          "

      - name: Salva index.json nel repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add canti/index.json
          git diff --staged --quiet || (git commit -m "Aggiornamento automatico index.json" && git push)
