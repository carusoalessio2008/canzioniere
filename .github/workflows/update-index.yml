name: Aggiorna Indice Canti Automatico

on:
  push:
    branches:
      - main
    paths:
      - 'canti/*.json'
      - '!canti/index.json'

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Genera canti/index.json
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "canti";
            const files = fs.readdirSync(dir).filter(f => f.endsWith(".json") && f !== "index.json");
            const index = files.map(file => {
              const raw = fs.readFileSync(path.join(dir, file), "utf8");
              const data = JSON.parse(raw);
              const id = data.id || file.replace(/\.json$/, "");
              const contentStr = typeof data.content === "string" ? data.content : "";
              const firstLine = data.firstLine || contentStr.split("\n").find(l => l.trim() && !l.trim().startsWith("["))?.replace(/\[[^\]]+\]/g, "").trim() || "";
              return {
                id,
                file,
                title: data.title || id,
                author: data.author || "",
                categories: Array.isArray(data.categories) ? data.categories : [],
                firstLine
              };
            }).sort((a, b) => a.title.localeCompare(b.title));
            fs.writeFileSync(path.join(dir, "index.json"), JSON.stringify(index, null, 2));
          '

      - name: Commit e Push index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add canti/index.json
          git diff --staged --quiet || (git commit -m "Aggiorna automaticamente canti/index.json" && git push)